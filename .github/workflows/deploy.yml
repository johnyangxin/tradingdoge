name: Deploy to Tencent Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /var/www/tradingdoge
            git pull origin main

            # Install build tools for native modules
            sudo apt-get update -qq
            sudo apt-get install -y python3 make g++

            # Install backend dependencies (need devDeps for better-sqlite3 compilation)
            cd backend
            npm install

            # Build TypeScript workers
            npm run build

            # Build frontend
            cd ../frontend
            npm install
            npm run build

            # Restart services
            pm2 restart all || pm2 start /var/www/tradingdoge/deploy/config/pm2.json

            # Show status
            pm2 status